# Plan Render (Blueprint) : New > Blueprint > choisir ce dépôt GitHub
services:
  - type: web
    name: scalprl-m1
    runtime: docker
    plan: free               # gratuit : 512 Mo / 0,1 processeur (décision ~10-20 s) ; « starter » (7 $/mois) = 0,5 processeur
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SCALPRL_TOKEN   # mot de passe entre l'EA et le service (Render le génère ; à recopier dans l'EA)
        generateValue: true
